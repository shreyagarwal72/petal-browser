name: 🦁 Petal Browser — Brave Engine Release Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      brave_version:
        description: 'Brave release tag (e.g. v1.98.60 or latest)'
        required: false
        default: 'latest'

concurrency:
  group: petal-brave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Petal Brave APK (arm64-v8a)
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📱 Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: ⚡ Cache Genuine Brave Engine Components
        id: cache-brave-core
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a
            app/src/main/assets
            app/libs/brave_core_classes.jar
          key: brave-core-v1.100.23-p2-${{ runner.os }}-arm64

      - name: 🦁 Download & Extract Genuine Brave Engine Components
        if: steps.cache-brave-core.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/fetch_brave_core.sh
          ./scripts/fetch_brave_core.sh "${{ github.event.inputs.brave_version || 'latest' }}"

      - name: 🐘 Build Petal Release APK with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: ✍️ Sign APK
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_KEY_BASE64 || secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
        run: |
          echo "Listing all generated APKs:"
          ls -la app/build/outputs/apk/release/ || true
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*arm64*.apk" -o -name "app-release-unsigned.apk" -o -name "*.apk" | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"

          ANDROID_SDK_BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
          echo "Using Android Build-Tools: $ANDROID_SDK_BUILD_TOOLS"

          ALIGNED_APK="/tmp/aligned.apk"
          $ANDROID_SDK_BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK" || cp "$UNSIGNED_APK" "$ALIGNED_APK"

          if [ -n "$SIGNING_KEY" ]; then
            echo "✅ Using secret SIGNING_KEY..."
            echo "$SIGNING_KEY" | base64 -d > /tmp/release.keystore
            STORE_P="${STORE_PASS:-android}"
            KEY_P="${KEY_PASS:-android}"
            ALIAS_N="${KEY_ALIAS:-releasekey}"
          elif [ -f "app/release.keystore" ]; then
            echo "✅ Using canonical committed Petal release.keystore..."
            cp app/release.keystore /tmp/release.keystore
            STORE_P="android"
            KEY_P="android"
            ALIAS_N="releasekey"
          else
            echo "⚠️ Generating and signing with automated release key..."
            keytool -genkeypair -v -keystore /tmp/release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Petal Browser, O=Petal, C=US"
            STORE_P="android"
            KEY_P="android"
            ALIAS_N="releasekey"
          fi

          $ANDROID_SDK_BUILD_TOOLS/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-key-alias "$ALIAS_N" \
            --ks-pass "pass:$STORE_P" \
            --key-pass "pass:$KEY_P" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out petal-browser-arm64-signed.apk \
            "$ALIGNED_APK"

          $ANDROID_SDK_BUILD_TOOLS/apksigner verify --verbose petal-browser-arm64-signed.apk
          ls -lh petal-browser-arm64-signed.apk
          echo "Verifying APK 64-bit arm64-v8a architecture:"
          unzip -l petal-browser-arm64-signed.apk | grep "lib/" || true
          if unzip -l petal-browser-arm64-signed.apk | grep -q "lib/armeabi-v7a" || unzip -l petal-browser-arm64-signed.apk | grep -q "lib/x86/"; then
            echo "❌ Error: APK contains 32-bit binaries!"
            exit 1
          fi
          echo "✅ Verified: APK contains pure 64-bit architecture!"
      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: petal-browser-brave-arm64
          path: petal-browser-arm64-signed.apk
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: "Petal Browser with Genuine Brave Engine ${{ github.ref_name }}"
          body: |
            ## 🦁 Petal Browser — Genuine Brave Engine Release
            
            Built with 100% genuine Brave Chromium native core:
            - **Engine**: Genuine Brave `libchrome.so` + `libbrave.so` (Brave Shields Rust/C++)
            - **No System WebView**: Direct native Chromium pipeline
            - **Features**: Chrome Web Store extensions, 24-word Brave Sync v2, Brave Shields, Native Chromium Cache/Storage Manager
            - **UI/UX**: Petal Material 3 Expressive + Liquid Glass UI
            - **Architecture**: `arm64-v8a`
          files: petal-browser-arm64-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
