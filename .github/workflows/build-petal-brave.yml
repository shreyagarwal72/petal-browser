name: 🦁 Petal Browser — Brave Engine Release Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      brave_version:
        description: 'Brave release tag (e.g. v1.98.60 or latest)'
        required: false
        default: 'latest'

concurrency:
  group: petal-brave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Petal Brave APK (arm64-v8a)
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📱 Install Android Build Tools
        run: |
          sudo apt-get update && sudo apt-get install -y zipalign apksigner

      - name: 🦁 Download Authentic Brave Browser APK
        run: |
          mkdir -p base_apk
          BRAVE_VER="${{ github.event.inputs.brave_version || 'latest' }}"
          if [ "$BRAVE_VER" = "latest" ]; then
            DOWNLOAD_URL=$(curl -s https://api.github.com/repos/brave/brave-browser/releases/latest | grep "browser_download_url.*Bravearm64Universal\.apk" | head -n 1 | cut -d '"' -f 4)
          else
            DOWNLOAD_URL="https://github.com/brave/brave-browser/releases/download/${BRAVE_VER}/Bravearm64Universal.apk"
          fi
          echo "Downloading base from $DOWNLOAD_URL..."
          curl -L -o base_apk/Bravearm64Universal.apk "$DOWNLOAD_URL"
          ls -lh base_apk/Bravearm64Universal.apk

      - name: 🌸 Run Petal Customization & Rebranding Pipeline
        run: |
          python3 scripts/rebrand_brave_to_petal.py base_apk/Bravearm64Universal.apk petal-browser-brave-rebranded.apk

      - name: 🔍 Verify Signed APK
        run: |
          apksigner verify --verbose petal-browser-brave-rebranded.apk
          ls -lh petal-browser-brave-rebranded.apk

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: petal-browser-brave-rebranded
          path: petal-browser-brave-rebranded.apk
          if-no-files-found: error

      - name: 🚀 Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
          name: "Petal Browser with Genuine Brave Engine ${{ github.ref_name }}"
          body: |
            ## 🌸 Petal Browser (Built on Authentic Brave Engine)
            
            - **Base**: Genuine Brave Chromium 64-bit arm64-v8a engine
            - **Package Name**: `com.petal.browser`
            - **Version**: 4.4.000 (code 440)
            - **Features**: Full Brave Shields, Sync v2, native web rendering intact
            - **Signature**: Authentic Petal keystore
          files: petal-browser-brave-rebranded.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
